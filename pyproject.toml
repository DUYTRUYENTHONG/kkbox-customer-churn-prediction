[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kkbox-customer-churn-prediction"
version = "0.1.0"
description = "As-of-date churn baseline for the KKBox competition dataset"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "scikit-learn>=1.5,<2", "joblib>=1.4,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
kkbox-churn = "kkbox_churn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

